# PostgreSQL 起動用 Docker Compose 定義（本番構成）
#
# 構成:
#   - postgres   : 業務 DB（bot が読み書きする正本）
#   - bot        : systemd で動かし、DATABASE_URL で 127.0.0.1:5432 の
#                  業務 DB に接続する（この Compose には含めない）
#
# 使い方:
#   1. deploy/.env を作成（値はコミットしない。deploy/.env.example 参照）:
#        POSTGRES_USER=clubbot
#        POSTGRES_PASSWORD=<強固なパスワード>
#        POSTGRES_DB=clubdb
#   2. 起動:
#        cd deploy && docker compose -f docker-compose.postgres.yml up -d
#   3. bot 側の .env に DATABASE_URL を設定して bot を起動:
#        DATABASE_URL=postgresql://clubbot:<パスワード>@127.0.0.1:5432/clubdb
#      （bot 起動時に業務テーブルが作成される）
#
# 旧 Directus 構成（docker-compose.directus.yml）からの移行:
#   ボリューム名（pgdata）は旧構成と同じため、
#     docker compose -f docker-compose.directus.yml down   # ※ -v は付けない
#     docker compose -f docker-compose.postgres.yml up -d
#   でデータを維持したまま Directus コンテナだけを撤去できる。
#   業務 DB 内に残る directus_* メタテーブルは bot の動作に影響しない
#   （不要なら手動で DROP してよい）。
#
# 注意:
#   - ポートは 127.0.0.1 にバインド（外部公開しない）
#   - SQLite（data/club.db）はローカル開発・テスト専用
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?deploy/.env を設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:?deploy/.env を設定してください}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
